name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build freebuff-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: reverb-os
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build .#freebuff-desktop --print-out-paths

      - name: Check derivation metadata
        run: |
          VERSION=$(nix eval .#freebuff-desktop.version --raw)
          echo "Package version: $VERSION"
          nix derivation show .#freebuff-desktop | jq -r '.[].name'
